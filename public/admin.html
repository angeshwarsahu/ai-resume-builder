<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — ATS Resume Builder Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif; background:#F7F8F7; color:#1B2430; margin:0;}
  .wrap{max-width:760px; margin:0 auto; padding:32px 20px 80px;}
  h1{font-family:'Sora',sans-serif; font-weight:800; font-size:22px; margin:0 0 20px;}
  .card{background:#fff; border:1px solid #E4E4DE; border-radius:14px; padding:18px; margin-bottom:16px;}
  label{display:block; font-size:12.5px; font-weight:600; color:#5B6472; margin-bottom:5px; margin-top:12px;}
  input, textarea{width:100%; box-sizing:border-box; border:1px solid #E4E4DE; border-radius:8px; padding:9px 11px; font-size:14px; font-family:inherit;}
  textarea{resize:vertical;}
  button{background:#1E3A5F; color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:13.5px; font-weight:700; cursor:pointer; margin-top:12px; margin-right:8px;}
  button.secondary{background:#fff; color:#1B2430; border:1px solid #E4E4DE;}
  button:disabled{opacity:.5; cursor:not-allowed;}
  .msg{font-size:13px; padding:8px 12px; border-radius:8px; margin-top:10px;}
  .msg.err{background:#FBE7E7; color:#C23B3B;}
  .msg.ok{background:#E1F5EE; color:#157F5F;}
  .list-item{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #F0F0EA; font-size:13.5px;}
  .list-item a{color:#1E3A5F; text-decoration:none; font-weight:600;}
  .list-item button{margin:0; padding:5px 10px; font-size:12px;}
  #gate{max-width:340px; margin:80px auto;}
</style>
</head>
<body>

<div id="gate" class="card">
  <h1>Admin login</h1>
  <label>Password</label>
  <input type="password" id="pw" placeholder="Enter admin password">
  <button onclick="unlock()">Unlock</button>
  <div id="gateMsg"></div>
</div>

<div id="app" class="wrap" style="display:none;">
  <h1>Blog admin</h1>

  <div class="card">
    <div style="font-weight:700;margin-bottom:6px;">Draft with AI</div>
    <label>Topic</label>
    <input id="topic" placeholder="e.g. How to write a resume with no experience">
    <button onclick="draftArticle()" id="draftBtn">Draft with AI</button>
    <div id="draftMsg"></div>
  </div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:6px;">Edit & publish</div>
    <label>Title</label>
    <input id="title" oninput="autoSlug()">
    <label>URL slug (auto-generated, editable)</label>
    <input id="slug">
    <label>Summary (meta description, ~150 characters)</label>
    <textarea id="summary" rows="2"></textarea>
    <label>Content (paragraphs separated by a blank line)</label>
    <textarea id="content" rows="12" oninput="updatePreview()"></textarea>
    <button onclick="publish(false)" id="draftBtn" class="secondary">Save draft</button>
    <button onclick="publish(true)" id="publishBtn">Publish</button>
    <button class="secondary" onclick="clearForm()">Clear form</button>
    <div id="publishMsg"></div>
  </div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:8px;">Preview (how it'll look on the site)</div>
    <div id="previewBox" style="font-size:13.5px;line-height:1.6;color:#333;"></div>
  </div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:8px;">Your articles</div>
    <div id="articleList">Loading...</div>
  </div>
</div>

<script>
let PASSWORD = '';

function slugify(title){
  return String(title||'').toLowerCase().trim()
    .replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').slice(0,80);
}
function autoSlug(){
  document.getElementById('slug').value = slugify(document.getElementById('title').value);
}
function showMsg(id, text, ok){
  const el = document.getElementById(id);
  el.className = 'msg ' + (ok?'ok':'err');
  el.textContent = text;
  setTimeout(()=>{ el.textContent=''; el.className=''; }, 4000);
}

async function unlock(){
  const pw = document.getElementById('pw').value;
  if(!pw) return;
  PASSWORD = pw;
  // Verify by attempting a harmless authenticated call; kv-articles GET is
  // public and doesn't check the password, so we verify via a cheap POST
  // with delete:true on a slug that doesn't exist — if the password is
  // wrong we get 401 back, otherwise a normal (no-op) response.
  try{
    const res = await fetch('/api/kv-articles', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: PASSWORD, delete: true, slug: '__password_check__' }),
    });
    if(res.status === 401){
      document.getElementById('gateMsg').innerHTML = '<div class="msg err">Wrong password.</div>';
      return;
    }
  }catch(e){
    document.getElementById('gateMsg').innerHTML = '<div class="msg err">Could not reach server.</div>';
    return;
  }
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadArticles();
}

async function draftArticle(){
  const topic = document.getElementById('topic').value.trim();
  if(!topic) return;
  const btn = document.getElementById('draftBtn');
  btn.disabled = true; btn.textContent = 'Drafting...';
  try{
    const res = await fetch('/api/draft-article', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: PASSWORD, topic }),
    });
    const data = await res.json();
    if(!data.success){ showMsg('draftMsg', data.message || 'Failed', false); return; }
    document.getElementById('title').value = data.data.title || '';
    document.getElementById('summary').value = data.data.summary || '';
    document.getElementById('content').value = data.data.content || '';
    autoSlug();
    showMsg('draftMsg', 'Draft ready — review and edit before publishing.', true);
  }catch(e){
    showMsg('draftMsg', 'Could not reach AI.', false);
  }
  btn.disabled = false; btn.textContent = 'Draft with AI';
}

async function publish(){
  const title = document.getElementById('title').value.trim();
  const slug = document.getElementById('slug').value.trim();
  const summary = document.getElementById('summary').value.trim();
  const content = document.getElementById('content').value.trim();
  if(!title || !slug || !content){ showMsg('publishMsg','Title, slug, and content are required.', false); return; }
  const btn = document.getElementById('publishBtn');
  btn.disabled = true;
  try{
    const res = await fetch('/api/kv-articles', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: PASSWORD, slug, title, summary, content }),
    });
    const data = await res.json();
    if(!data.success){ showMsg('publishMsg', data.message || 'Failed', false); btn.disabled=false; return; }
    showMsg('publishMsg', 'Published! Live at /blog/' + slug, true);
    loadArticles();
  }catch(e){
    showMsg('publishMsg', 'Could not reach server.', false);
  }
  btn.disabled = false;
}

function clearForm(){
  ['topic','title','slug','summary','content'].forEach(id=>document.getElementById(id).value='');
}

async function loadArticles(){
  const el = document.getElementById('articleList');
  try{
    const res = await fetch('/api/kv-articles');
    const data = await res.json();
    if(!data.success || !data.data.length){ el.textContent = 'No articles yet.'; return; }
    el.innerHTML = data.data.map(a => `
      <div class="list-item">
        <a href="/blog/${a.slug}" target="_blank">${a.title}</a>
        <span>
          <button class="secondary" onclick='editArticle(${JSON.stringify(a).replace(/'/g,"&#39;")})'>Edit</button>
          <button class="secondary" onclick="deleteArticle('${a.slug}')">Delete</button>
        </span>
      </div>`).join('');
  }catch(e){ el.textContent = 'Could not load articles.'; }
}

function editArticle(a){
  document.getElementById('title').value = a.title;
  document.getElementById('slug').value = a.slug;
  document.getElementById('summary').value = a.summary;
  document.getElementById('content').value = a.content;
  window.scrollTo(0,0);
}

async function deleteArticle(slug){
  if(!confirm('Delete this article? This cannot be undone.')) return;
  try{
    const res = await fetch('/api/kv-articles', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: PASSWORD, delete: true, slug }),
    });
    const data = await res.json();
    if(data.success) loadArticles();
    else showMsg('publishMsg', data.message || 'Failed to delete', false);
  }catch(e){ showMsg('publishMsg','Could not reach server.', false); }
}
</script>
</body>
</html>
